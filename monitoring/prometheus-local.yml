# Prometheus configuration for local MacBook Air M2 deployment
# Optimized for 8GB RAM and personal trading use

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'smartmarket-local'
    environment: 'local'

# Local alerting (simplified)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load local rules
rule_files:
  - "rules/local_rules.yml"

# Scrape configurations - optimized for local use
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s

  # SmartMarketOOPS Backend API
  - job_name: 'smartmarket-backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # ML Service
  - job_name: 'smartmarket-ml'
    static_configs:
      - targets: ['ml-service:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Frontend Application
  - job_name: 'smartmarket-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 60s
    scrape_timeout: 10s

  # Database Monitoring (simplified)
  - job_name: 'postgres-health'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 60s
    scrape_timeout: 10s

  # Redis Cache
  - job_name: 'redis-health'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 60s
    scrape_timeout: 10s

  # Trading-Specific Metrics (Personal Trading)
  - job_name: 'personal-trading'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/api/trading/metrics'
    scrape_interval: 10s  # More frequent for active trading
    scrape_timeout: 5s

  # Delta Exchange Health Check
  - job_name: 'delta-exchange'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/api/external/delta/health'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ML Model Performance
  - job_name: 'ml-models'
    static_configs:
      - targets: ['ml-service:8000']
    metrics_path: '/models/metrics'
    scrape_interval: 60s
    scrape_timeout: 15s

  # Risk Management (Personal Limits)
  - job_name: 'risk-management'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/api/risk/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

# Storage optimization for MacBook Air
storage:
  tsdb:
    retention.time: 7d
    retention.size: 500MB
    min-block-duration: 2h
    max-block-duration: 25h
    wal-compression: true